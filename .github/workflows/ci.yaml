name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # ローカルの Nix 版と合わせる (`flutter --version` で確認)。
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - run: flutter analyze
      - run: flutter test
